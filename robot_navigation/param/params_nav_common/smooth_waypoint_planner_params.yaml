SmoothWaypointPlanner:
  waypoint_file: "/home/shuiy/catkin_ws/src/robot_navigation/config/com.csv"
  waypoints_topic: "/waypoint_editor/waypoints_path"
  prefer_live_waypoints: true
  resolution: 0.05
  min_waypoint_spacing: 0.05
  # 进入任务的 0.1 m 触发范围后，才允许推进到下一个航点。
  waypoint_reached_threshold: 0.05
  corner_rounding_min_turn_deg: 30.0
  # 保留任务航点拐角，避免平滑曲线绕过车牌识别位置。
  corner_blend_distance: 0.05
  loop_waypoints: false
  use_waypoint_sequence_goal: true
